name: Build Windows launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained x64
        shell: pwsh
        run: dotnet publish .\HenshinGridLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: HenshinGrid-win-x64
          path: publish/
          if-no-files-found: error